steps:
  # Step 1: Build the Docker image
  - name: "gcr.io/cloud-builders/docker"
    args:
      - build
      - -t
      - "gcr.io/$PROJECT_ID/whatsapp-repair-bot:$COMMIT_SHA"
      - -t
      - "gcr.io/$PROJECT_ID/whatsapp-repair-bot:latest"
      - .

  # Step 2: Push image to Container Registry
  - name: "gcr.io/cloud-builders/docker"
    args:
      - push
      - --all-tags
      - "gcr.io/$PROJECT_ID/whatsapp-repair-bot"

  # Step 3: Deploy to Cloud Run with secrets from Secret Manager
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    entrypoint: gcloud
    args:
      - run
      - services
      - update
      - whatsapp-repair-bot
      - --image=gcr.io/$PROJECT_ID/whatsapp-repair-bot:$COMMIT_SHA
      - --region=us-central1
      - --platform=managed
      - --allow-unauthenticated
      - --set-secrets=WHATSAPP_TOKEN=whatsapp-token:latest,GEMINI_API_KEY=gemini-api-key:latest,PHONE_NUMBER_ID=phone-number-id:latest,VERIFY_TOKEN=verify-token:latest
      - --set-env-vars=LOG_LEVEL=INFO,WHATSAPP_API_VERSION=v21.0
      - --memory=512Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=10
      - --timeout=60
      - --startup-cpu-boost

images:
  - "gcr.io/$PROJECT_ID/whatsapp-repair-bot:$COMMIT_SHA"
  - "gcr.io/$PROJECT_ID/whatsapp-repair-bot:latest"
