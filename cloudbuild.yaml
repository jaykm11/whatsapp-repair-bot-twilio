steps:
  # Step 1: Build the Docker image
  - name: "gcr.io/cloud-builders/docker"
    args:
      - build
      - -t
      - "gcr.io/$PROJECT_ID/whatsapp-repair-bot:$COMMIT_SHA"
      - -t
      - "gcr.io/$PROJECT_ID/whatsapp-repair-bot:latest"
      - .

  # Step 2: Push image to Container Registry
  - name: "gcr.io/cloud-builders/docker"
    args:
      - push
      - --all-tags
      - "gcr.io/$PROJECT_ID/whatsapp-repair-bot"

  # Step 3: Deploy to Cloud Run with secrets from Secret Manager
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    entrypoint: gcloud
    args:
      - run
      - deploy
      - whatsapp-repair-bot
      - --image=gcr.io/$PROJECT_ID/whatsapp-repair-bot:$COMMIT_SHA
      - --region=us-central1
      - --platform=managed
      - --allow-unauthenticated
      - --set-secrets=TWILIO_ACCOUNT_SID=TWILIO_ACCOUNT_SID:latest,TWILIO_AUTH_TOKEN=TWILIO_AUTH_TOKEN:latest,TWILIO_WHATSAPP_NUMBER=TWILIO_WHATSAPP_NUMBER:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest
      - --set-env-vars=LOG_LEVEL=INFO
      - --memory=512Mi
      - --cpu=1
      - --no-cpu-throttling
      - --min-instances=0
      - --max-instances=10
      - --timeout=60

options:
  # Required when a custom service account is specified — stores logs in a
  # regional bucket owned by your project instead of the default GCS bucket.
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET

images:
  - "gcr.io/$PROJECT_ID/whatsapp-repair-bot:$COMMIT_SHA"
  - "gcr.io/$PROJECT_ID/whatsapp-repair-bot:latest"
